{% extends "base.html" %}

{% block title %}SST - Estadísticas{% endblock %}

{% block content %}

    <div class="row mb-4">

                    <p class="text-muted mb-0">Métricas y seguimiento del contenido de seguridad</p>
                </div>
                <a href="{{ url_for('sst_dashboard') }}" class="btn btn-outline-secondary">

                            <label class="form-label">Rango de fechas</label>

                                <option value="30" selected>Últimos 30 días</option>
                                <option value="90">Últimos 3 meses</option>
                                <option value="365">Último año</option>
                            </select>

                        <div class="col-md-3">
                            <label class="form-label">Categoría</label>

                                <option value="5">Emergencias</option>

                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Usuario</label>
                            <select class="form-select">
                                <option value="">Todos los usuarios</option>
                                <option value="1">Usuario 1</option>
                                <option value="2">Usuario 2</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-primary w-100">
                                <i class="fas fa-filter me-2"></i>Aplicar Filtros
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">

                    <h3 class="text-primary">24</h3>
                    <p class="text-muted mb-0">Usuarios Activos</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-play-circle fa-2x text-success mb-3"></i>
                    <h3 class="text-success">156</h3>
                    <p class="text-muted mb-0">Visualizaciones</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
