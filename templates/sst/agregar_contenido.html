{% extends "base_sst.html" %}
{% block title %}Agregar Contenido SST{% endblock %}
{% block content %}
<div class="container"><div class="row justify-content-center mt-4"><div class="col-md-8">
    <div class="card">
        <div class="card-header" style="background: linear-gradient(135deg, #198754 0%, #20c997 100%); color: white;">
            <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Agregar Contenido SST</h4>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3"><label class="form-label fw-semibold"><i class="fas fa-heading me-1"></i>Título *</label><input type="text" class="form-control" name="titulo" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Descripción</label><textarea class="form-control" name="descripcion" rows="3"></textarea></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Tipo *</label><select class="form-select" name="tipo" required><option value="video">Video</option><option value="documento">Documento</option></select></div>
                    <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Categoría</label><input type="text" class="form-control" name="categoria" placeholder="Ej: Capacitación, EPP, etc."></div>
                </div>
                <div class="mb-3"><label class="form-label fw-semibold">URL del Video/Documento *</label><input type="url" class="form-control" name="url" required></div>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="obligatorio" id="obligatorio"><label class="form-check-label" for="obligatorio">Marcar como obligatorio</label></div>
                <div class="d-flex justify-content-end gap-2"><a href="{{ url_for('sst_contenido') }}" class="btn btn-secondary"><i class="fas fa-times me-1"></i>Cancelar</a><button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Guardar</button></div>
            </form>
        </div>
    </div>
</div></div></div>
{% endblock %}
