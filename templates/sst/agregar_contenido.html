{% extends "base.html" %}

{% block title %}Agregar Contenido SST{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Agregar Contenido SST</h2>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título *</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="categoria_id" class="form-label">Categoría *</label>
                            <select class="form-control" id="categoria_id" name="categoria_id" required>
                                <option value="">Seleccionar categoría</option>
                                {% for categoria in categorias %}
                                <option value="{{ categoria.id }}" style="color: {{ categoria.color }}">
                                    {{ categoria.nombre }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo de Contenido *</label>
                            <select class="form-control" id="tipo" name="tipo" required>
                                <option value="">Seleccionar tipo</option>
                                <option value="video">Video</option>
                                <option value="documento">Documento</option>
                                <option value="imagen">Imagen</option>
                                <option value="enlace">Enlace</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="es_obligatorio" name="es_obligatorio">
                            <label class="form-check-label" for="es_obligatorio">Contenido Obligatorio</label>
                        </div>
                    </div>
                </div>

                <!-- Campos dinámicos según tipo -->
                <div id="campos-video" class="campos-tipo" style="display: none;">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="video_url" class="form-label">URL del Video (YouTube, Vimeo, etc.)</label>
                                <input type="url" class="form-control" id="video_url" name="video_url">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="duracion_video" class="form-label">Duración (minutos)</label>
                                <input type="number" class="form-control" id="duracion_video" name="duracion_video" min="1">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="campos-archivo" class="campos-tipo" style="display: none;">
                    <div class="mb-3">
                        <label for="archivo_url" class="form-label">URL del Archivo</label>
                        <input type="url" class="form-control" id="archivo_url" name="archivo_url">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="archivo_local" class="form-label">Subir Archivo</label>
                    <input type="file" class="form-control" id="archivo_local" name="archivo_local" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.gif,.mp4,.avi,.mov">
                    <div class="form-text">Formatos permitidos: PDF, Word, Excel, PowerPoint, imágenes, videos</div>
                </div>

                <div class="mb-3">
                    <label for="tags" class="form-label">Etiquetas</label>
                    <input type="text" class="form-control" id="tags" name="tags" placeholder="Separar con comas">
                </div>

                <button type="submit" class="btn btn-primary">Agregar Contenido</button>
                <a href="{{ url_for('sst_contenido') }}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('tipo').addEventListener('change', function() {
    // Ocultar todos los campos primero
    document.querySelectorAll('.campos-tipo').forEach(function(el) {
        el.style.display = 'none';
    });
    
    // Mostrar campos según el tipo seleccionado
    const tipo = this.value;
    if (tipo === 'video') {
        document.getElementById('campos-video').style.display = 'block';
    } else if (tipo === 'documento' || tipo === 'imagen' || tipo === 'enlace') {
        document.getElementById('campos-archivo').style.display = 'block';
    }
});
</script>
{% endblock %}
