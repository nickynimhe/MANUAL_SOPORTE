{% extends 'base_sst.html' %}

{% block title %}Agregar Nueva Actividad - Plan Anual PESV{% endblock %}

{% block content %}
<div class="container-fluid px-0 px-md-3">

    <!-- HEADER CON EFECTO SHIMMER -->
    <div class="sst-header bg-gradient-corporate rounded-4 mb-4 p-4 text-white shadow-lg">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
            <div class="mb-3 mb-md-0">
                <div class="d-flex align-items-center mb-2">
                    <div class="bg-white rounded-3 p-2 me-3 shadow-sm">
                        <i class="fas fa-plus-circle" style="color: #2658A5; font-size: 1.8rem;"></i>
                    </div>
                    <div>
                        <h1 class="h2 fw-bold mb-1 text-white">Agregar Nueva Actividad</h1>
                        <p class="text-white-80 mb-0">Plan Anual de Trabajo PESV 2026</p>
                    </div>
                </div>
            </div>
            <div>
                <a href="{{ url_for('sst_plan_anual_actividades') }}" class="btn btn-light btn-sm fw-medium shadow-sm">
                    <i class="fas fa-arrow-left me-1"></i> Volver
                </a>
            </div>
        </div>
    </div>

    <!-- MENSAJES FLASH -->
    <div id="flashMessages"></div>

    <!-- FORMULARIO -->
    <div class="card border-0 shadow-sm overflow-hidden">
        <div class="card-header py-3" style="background: linear-gradient(135deg, #2658A5 0%, #282F4B 100%);">
            <h5 class="mb-0 fw-semibold text-white">
                <i class="fas fa-edit me-2"></i> Datos de la Actividad
            </h5>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('sst_plan_anual_nueva_actividad') }}">
                
                <!-- Actividad -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-tasks me-1" style="color: #C23538;"></i> Actividad *
                    </label>
                    <input type="text" name="actividad" class="form-control rounded-3" 
                           placeholder="Nombre de la actividad" required>
                </div>

                <!-- Evidencia -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-file-alt me-1" style="color: #FFCC29;"></i> Evidencia / Descripción
                    </label>
                    <textarea name="evidencia" class="form-control rounded-3" rows="3" 
                              placeholder="Descripción detallada de la actividad..."></textarea>
                </div>

                <!-- Ciclo PHVA -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-sync-alt me-1" style="color: #2658A5;"></i> Ciclo PHVA *
                    </label>
                    <select name="ciclo" class="form-select rounded-3" required>
                        <option value="">Seleccionar</option>
                        <option value="Planear">📋 Planear</option>
                        <option value="Hacer">🔨 Hacer</option>
                        <option value="Verificar">🔍 Verificar</option>
                        <option value="Actuar">📈 Actuar</option>
                    </select>
                </div>

                <!-- Responsables -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-user-tie me-1" style="color: #28a745;"></i> Responsables
                    </label>
                    <input type="text" name="responsables" class="form-control rounded-3" 
                           placeholder="Ej: SST, Gerencia, COPASST">
                </div>

                <!-- Nivel -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-chart-line me-1" style="color: #C23538;"></i> Nivel
                    </label>
                    <input type="text" name="nivel" class="form-control rounded-3" 
                           placeholder="Ej: Estándar, Avanzado, N/A">
                </div>

                <!-- Estado -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-flag me-1" style="color: #FFCC29;"></i> Estado
                    </label>
                    <select name="estado" class="form-select rounded-3">
                        <option value="pendiente">⏳ Pendiente</option>
                        <option value="en_proceso">🔄 En Proceso</option>
                        <option value="completado">✅ Completado</option>
                    </select>
                </div>

                <!-- Avance -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-chart-simple me-1" style="color: #2658A5;"></i> Avance (%)
                    </label>
                    <input type="number" name="avance" class="form-control rounded-3" 
                           value="0" min="0" max="100">
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-between pt-3 border-top">
                    <a href="{{ url_for('sst_plan_anual_actividades') }}" class="btn btn-secondary px-4">
                        <i class="fas fa-times me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary px-5" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); border: none;">
                        <i class="fas fa-save me-2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.bg-gradient-corporate {
    background: linear-gradient(135deg, #2658A5 0%, #1a3f73 50%, #282F4B 100%) !important;
    position: relative;
    overflow: hidden;
}

.bg-gradient-corporate::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    animation: shimmer 8s infinite linear;
}

@keyframes shimmer {
    0% { transform: translate(-30%, -30%) rotate(0deg); }
    100% { transform: translate(30%, 30%) rotate(360deg); }
}

.form-control, .form-select {
    border: 1px solid #e5e7eb;
    transition: all 0.2s ease;
}

.form-control:focus, .form-select:focus {
    border-color: #2658A5;
    box-shadow: 0 0 0 3px rgba(38,88,165,0.15);
}

.btn {
    transition: all 0.2s ease;
    border-radius: 10px;
}

.btn:hover {
    transform: translateY(-2px);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.card {
    animation: fadeIn 0.4s ease;
}
</style>
{% endblock %}
