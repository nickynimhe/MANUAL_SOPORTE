{% extends "base_sst.html" %}
{% block title %}Editar Contenido SST{% endblock %}
{% block content %}
<div class="container"><div class="row justify-content-center mt-4"><div class="col-md-8">
    <div class="card">
        <div class="card-header" style="background: linear-gradient(135deg, #198754 0%, #20c997 100%); color: white;">
            <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Editar Contenido</h4>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3"><label class="form-label fw-semibold">Título *</label><input type="text" class="form-control" name="titulo" value="{{ contenido.titulo }}" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Descripción</label><textarea class="form-control" name="descripcion" rows="3">{{ contenido.descripcion or '' }}</textarea></div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Tipo</label><select class="form-select" name="tipo"><option value="video" {% if contenido.tipo == 'video' %}selected{% endif %}>Video</option><option value="documento" {% if contenido.tipo == 'documento' %}selected{% endif %}>Documento</option></select></div>
                    <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Categoría</label><input type="text" class="form-control" name="categoria" value="{{ contenido.categoria or '' }}"></div>
                </div>
                <div class="mb-3"><label class="form-label fw-semibold">URL</label><input type="url" class="form-control" name="url" value="{{ contenido.url or '' }}"></div>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="obligatorio" id="obligatorio" {% if contenido.obligatorio %}checked{% endif %}><label class="form-check-label" for="obligatorio">Obligatorio</label></div>
                <div class="d-flex justify-content-end gap-2"><a href="{{ url_for('sst_contenido') }}" class="btn btn-secondary"><i class="fas fa-times me-1"></i>Cancelar</a><button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Actualizar</button></div>
            </form>
        </div>
    </div>
</div></div></div>
{% endblock %}
