{% extends obtener_template_base() %}

{% block title %}Cambiar Contraseña - Sistema M@STV{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-key me-2"></i>Cambiar Contraseña
                    </h4>
                </div>
                
                <div class="card-body">
                    <form method="POST" action="{{ url_for('cambiar_password') }}">
                        <div class="mb-3">
                            <label for="password_actual" class="form-label">
                                Contraseña Actual
                            </label>
                            <input type="password" class="form-control" 
                                   id="password_actual" name="password_actual" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="nueva_password" class="form-label">
                                Nueva Contraseña
                            </label>
                            <input type="password" class="form-control" 
                                   id="nueva_password" name="nueva_password" 
                                   minlength="6" required>
                            <small class="text-muted">
                                Mínimo 6 caracteres
                            </small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirmar_password" class="form-label">
                                Confirmar Nueva Contraseña
                            </label>
                            <input type="password" class="form-control" 
                                   id="confirmar_password" name="confirmar_password" 
                                   minlength="6" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Actualizar Contraseña
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
