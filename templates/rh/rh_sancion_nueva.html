{% extends "base_rh.html" %}

{% block title %}Nueva Sanción{% endblock %}

{% block rh_content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white py-3 border-0">
            <div class="d-flex align-items-center">
                <a href="{{ url_for('rh_sanciones') }}" class="btn btn-sm btn-outline-secondary me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h5 class="mb-0 fw-semibold" style="color: #2658A5;">
                    <i class="fas fa-plus-circle me-2"></i>Nueva Sanción Disciplinaria
                </h5>
            </div>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Empleado *</label>
                        <select name="empleado_id" class="form-select rounded-3" required>
                            <option value="">Seleccione un empleado</option>
                            {% for emp in empleados %}
                            <option value="{{ emp[0] }}">{{ emp[1] }} {{ emp[2] }} - {{ emp[3] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de Sanción *</label>
                        <select name="tipo" class="form-select rounded-3" required>
                            <option value="">Seleccione un tipo</option>
                            <option value="verbal">Llamado de atención verbal</option>
                            <option value="escrita">Llamado de atención escrito</option>
                            <option value="suspension">Suspensión</option>
                            <option value="multa">Multa</option>
                            <option value="terminacion">Terminación de contrato</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha *</label>
                        <input type="date" name="fecha" class="form-control rounded-3" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Duración (días)</label>
                        <input type="number" name="duracion_dias" class="form-control rounded-3" min="1">
                        <small class="text-muted">Solo para suspensiones</small>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Motivo *</label>
                        <textarea name="motivo" class="form-control rounded-3" rows="3" required></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descripción detallada</label>
                        <textarea name="descripcion" class="form-control rounded-3" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('rh_sanciones') }}" class="btn btn-secondary rounded-3">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary rounded-3">
                                <i class="fas fa-save me-1"></i> Registrar Sanción
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
