{% extends "base_rh.html" %}

{% block title %}Nuevo Contrato{% endblock %}

{% block rh_content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white py-3 border-0">
            <div class="d-flex align-items-center">
                <a href="{{ url_for('rh_contratos') }}" class="btn btn-sm btn-outline-secondary me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h5 class="mb-0 fw-semibold" style="color: #2658A5;">
                    <i class="fas fa-file-signature me-2"></i>Nuevo Contrato
                </h5>
            </div>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Empleado *</label>
                        <select name="empleado_id" class="form-select rounded-3" required>
                            <option value="">Seleccione un empleado</option>
                            {% for emp in empleados %}
                            <option value="{{ emp[0] }}">{{ emp[1] }} {{ emp[2] }} - {{ emp[3] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de Contrato *</label>
                        <select name="tipo_contrato" class="form-select rounded-3" required>
                            <option value="">Seleccione un tipo</option>
                            <option value="termino_fijo">Término Fijo</option>
                            <option value="indefinido">Término Indefinido</option>
                            <option value="obra_labor">Obra o Labor</option>
                            <option value="aprendizaje">Aprendizaje</option>
                            <option value="prestacion_servicios">Prestación de Servicios</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha Inicio *</label>
                        <input type="date" name="fecha_inicio" class="form-control rounded-3" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fecha Fin</label>
                        <input type="date" name="fecha_fin" class="form-control rounded-3">
                        <small class="text-muted">Dejar vacío si es indefinido</small>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Salario Contratado *</label>
                        <input type="number" step="0.01" name="salario_contratado" class="form-control rounded-3" placeholder="0.00" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado</label>
                        <select name="estado" class="form-select rounded-3">
                            <option value="activo">Activo</option>
                            <option value="finalizado">Finalizado</option>
                            <option value="suspendido">Suspendido</option>
                            <option value="terminado">Terminado</option>
                        </select>
                    </div>
                    
                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('rh_contratos') }}" class="btn btn-secondary rounded-3">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary rounded-3" style="background: linear-gradient(135deg, #2658A5 0%, #1a3f73 100%); border: none;">
                                <i class="fas fa-save me-1"></i> Guardar Contrato
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
