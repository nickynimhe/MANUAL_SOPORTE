{% extends "base_rh.html" %}

{% block title %}Editar Empleado{% endblock %}

{% block rh_content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white py-3 border-0">
            <div class="d-flex align-items-center">
                <a href="{{ url_for('rh_empleado_detalle', id=empleado[0] if empleado else '') }}" class="btn btn-sm btn-outline-secondary me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h5 class="mb-0 fw-semibold" style="color: #2658A5;">
                    <i class="fas fa-edit me-2"></i>Editar Empleado
                </h5>
            </div>
        </div>
        <div class="card-body p-4">
            {% if empleado %}
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Tipo Documento *</label>
                        <select name="tipo_documento" class="form-select rounded-3" required>
                            <option value="CC" {% if empleado[1] == 'CC' %}selected{% endif %}>Cédula de Ciudadanía</option>
                            <option value="CE" {% if empleado[1] == 'CE' %}selected{% endif %}>Cédula de Extranjería</option>
                            <option value="PEP" {% if empleado[1] == 'PEP' %}selected{% endif %}>Pasaporte</option>
                            <option value="TI" {% if empleado[1] == 'TI' %}selected{% endif %}>Tarjeta de Identidad</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Número Documento *</label>
                        <input type="text" name="documento" class="form-control rounded-3" value="{{ empleado[2] }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control rounded-3" value="{{ empleado[7] or '' }}">
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Primer Nombre *</label>
                        <input type="text" name="primer_nombre" class="form-control rounded-3" value="{{ empleado[3] }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Segundo Nombre</label>
                        <input type="text" name="segundo_nombre" class="form-control rounded-3" value="{{ empleado[4] or '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Primer Apellido *</label>
                        <input type="text" name="primer_apellido" class="form-control rounded-3" value="{{ empleado[5] }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Segundo Apellido</label>
                        <input type="text" name="segundo_apellido" class="form-control rounded-3" value="{{ empleado[6] or '' }}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" name="telefono" class="form-control rounded-3" value="{{ empleado[8] or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Celular</label>
                        <input type="text" name="celular" class="form-control rounded-3" value="{{ empleado[9] or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Fecha Nacimiento</label>
                        <input type="date" name="fecha_nacimiento" class="form-control rounded-3" value="{{ empleado[11] if empleado[11] else '' }}">
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label fw-semibold">Dirección</label>
                        <input type="text" name="direccion" class="form-control rounded-3" value="{{ empleado[10] or '' }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Cargo</label>
                        <select name="cargo_id" class="form-select rounded-3">
                            <option value="">Seleccione un cargo</option>
                            {% for cargo in cargos %}
                            <option value="{{ cargo[0] }}" {% if empleado[12] == cargo[0] %}selected{% endif %}>
                                {{ cargo[1] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Departamento</label>
                        <select name="departamento_id" class="form-select rounded-3">
                            <option value="">Seleccione un departamento</option>
                            {% for dep in departamentos %}
                            <option value="{{ dep[0] }}" {% if empleado[13] == dep[0] %}selected{% endif %}>
                                {{ dep[1] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Fecha Ingreso</label>
                        <input type="date" name="fecha_ingreso" class="form-control rounded-3" value="{{ empleado[14] if empleado[14] else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Fecha Retiro</label>
                        <input type="date" name="fecha_retiro" class="form-control rounded-3" value="{{ empleado[15] if empleado[15] else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Salario</label>
                        <input type="number" step="0.01" name="salario" class="form-control rounded-3" value="{{ empleado[17] if empleado[17] else '' }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado</label>
                        <select name="estado" class="form-select rounded-3">
                            <option value="activo" {% if empleado[16] == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="inactivo" {% if empleado[16] == 'inactivo' %}selected{% endif %}>Inactivo</option>
                            <option value="vacaciones" {% if empleado[16] == 'vacaciones' %}selected{% endif %}>Vacaciones</option>
                            <option value="incapacidad" {% if empleado[16] == 'incapacidad' %}selected{% endif %}>Incapacidad</option>
                        </select>
                    </div>
                    
                    <div class="col-12">
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('rh_empleado_detalle', id=empleado[0]) }}" class="btn btn-secondary rounded-3">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary rounded-3">
                                <i class="fas fa-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </div>
                </div>
            </form>
            {% else %}
            <p class="text-center">Empleado no encontrado</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
