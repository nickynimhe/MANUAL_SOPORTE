{% extends obtener_template_base() %}

{% block title %}Agregar Usuario - Sistema M@STV{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h5 class="mb-0">
                        <i class="fas fa-user-plus me-2"></i>Agregar Nuevo Usuario
                    </h5>
                </div>
                
                <div class="admin-card-body">
                    <form method="POST" action="{{ url_for('agregar_usuario') }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="usuario" class="form-label">Usuario *</label>
                                <input type="text" class="form-control" 
                                       id="usuario" name="usuario" 
                                       required autofocus>
                                <div class="form-text">Nombre de usuario para login</div>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" 
                                       id="password" name="password" 
                                       minlength="6" required>
                                <div class="form-text">Mínimo 6 caracteres</div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="rol" class="form-label">Rol *</label>
                                <select class="form-select" id="rol" name="rol" required>
                                    <option value="">Seleccionar rol...</option>
                                    <option value="admin">Administrador</option>
                                    <option value="sst">Personal SST</option>
                                    <option value="soporte">Soporte Técnico</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="modulo_principal" class="form-label">Módulo Principal *</label>
                                <select class="form-select" id="modulo_principal" name="modulo_principal" required>
                                    <option value="">Seleccionar módulo...</option>
                                    <option value="admin">Administrativo</option>
                                    <option value="sst">SST</option>
                                    <option value="soporte">Soporte Técnico</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Permisos (solo visibles para admin) -->
                        <div class="mb-4">
                            <label class="form-label">Permisos Especiales</label>
                            <div class="border rounded p-3">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="ver_fichas" name="ver_fichas">
                                            <label class="form-check-label" for="ver_fichas">
                                                Ver fichas de soporte
                                            </label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="agregar_fichas" name="agregar_fichas">
                                            <label class="form-check-label" for="agregar_fichas">
                                                Agregar fichas
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="editar_fichas" name="editar_fichas">
                                            <label class="form-check-label" for="editar_fichas">
                                                Editar fichas
                                            </label>
                                        </div>
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="eliminar_fichas" name="eliminar_fichas">
                                            <label class="form-check-label" for="eliminar_fichas">
                                                Eliminar fichas
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('gestion_usuarios') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-admin">
                                <i class="fas fa-save me-2"></i>Guardar Usuario
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const rolSelect = document.getElementById('rol');
    const moduloSelect = document.getElementById('modulo_principal');
    
    // Sincronizar rol con módulo principal
    rolSelect.addEventListener('change', function() {
        const rol = this.value;
        if (rol === 'admin') {
            moduloSelect.value = 'admin';
        } else if (rol === 'sst') {
            moduloSelect.value = 'sst';
        } else if (rol === 'soporte') {
            moduloSelect.value = 'soporte';
        }
    });
});
</script>
{% endblock %}
