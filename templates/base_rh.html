{% extends "base.html" %}

{% block title %}RH - Recursos Humanos{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <!-- Header RH -->
    <div class="rh-header bg-gradient-rh rounded-4 mb-4 p-4 text-white shadow-lg">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
            <div class="mb-3 mb-md-0">
                <div class="d-flex align-items-center mb-2">
                    <div class="bg-white rounded-3 p-2 me-3 shadow-sm">
                        <i class="fas fa-users" style="color: #2658A5; font-size: 1.8rem;"></i>
                    </div>
                    <div>
                        <h1 class="h2 fw-bold mb-1 text-white">Recursos Humanos</h1>
                        <p class="text-white-80 mb-0">Gestión de Talento Humano</p>
                    </div>
                </div>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="{{ url_for('rh_dashboard') }}" class="btn btn-light btn-sm fw-medium shadow-sm">
                    <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                </a>
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-home me-1"></i> Inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Contenido principal -->
    {% block rh_content %}{% endblock %}
</div>

<style>
.bg-gradient-rh {
    background: linear-gradient(135deg, #1a3a6e 0%, #0e2a52 50%, #0a1f3d 100%) !important;
    position: relative;
    overflow: hidden;
}

.bg-gradient-rh::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    animation: shimmer 8s infinite linear;
}

@keyframes shimmer {
    0% { transform: translate(-30%, -30%) rotate(0deg); }
    100% { transform: translate(30%, 30%) rotate(360deg); }
}

.card {
    border-radius: 16px;
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-2px);
}

.btn {
    border-radius: 10px;
    transition: all 0.2s ease;
}

.btn:hover {
    transform: translateY(-1px);
}
</style>
{% endblock %}
